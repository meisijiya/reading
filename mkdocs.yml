site_name: 读书知识库
site_url: https://meisijiya.github.io/reading/
repo_url: https://github.com/meisijiya/reading

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - section-index

nav:
  - 首页: index.md
  - 民法典100问:
    - 民法典100问/INDEX.md
    - 民法典100问/01-总则编/README.md
    - 民法典100问/02-物权编/README.md
    - 民法典100问/03-合同编/README.md
    - 民法典100问/04-人格权编/README.md
    - 民法典100问/05-婚姻家庭编/README.md
    - 民法典100问/06-继承编/README.md
    - 民法典100问/07-侵权责任编/README.md
    - 民法典100问/99-速查表.md
  - "Vibe Coding：AI 编程时代的认知重构":
    - "Vibe Coding：AI 编程时代的认知重构/INDEX.md"
    - "Vibe Coding：AI 编程时代的认知重构/01-走近VibeCoding/README.md"
    - "Vibe Coding：AI 编程时代的认知重构/02-如何VibeCoding/README.md"
    - "Vibe Coding：AI 编程时代的认知重构/03-VibeCoding的未来/README.md"
    - "Vibe Coding：AI 编程时代的认知重构/99-速查表.md"
  - "Claude Code橙皮书：AI编程实战 (花叔)":
    - "Claude Code橙皮书：AI编程实战 (花叔)/INDEX.md"
    - "Claude Code橙皮书：AI编程实战 (花叔)/01-第一部分/README.md"
    - "Claude Code橙皮书：AI编程实战 (花叔)/02-第二部分/README.md"
    - "Claude Code橙皮书：AI编程实战 (花叔)/03-第三部分/README.md"
    - "Claude Code橙皮书：AI编程实战 (花叔)/04-第四部分/README.md"
    - "Claude Code橙皮书：AI编程实战 (花叔)/99-速查表.md"
  - "凤凰架构：构建可靠的大型分布式系统":
    - "凤凰架构：构建可靠的大型分布式系统/INDEX.md"
    - "凤凰架构：构建可靠的大型分布式系统/01-演进中的架构/README.md"
    - "凤凰架构：构建可靠的大型分布式系统/02-架构师的视角/README.md"
    - "凤凰架构：构建可靠的大型分布式系统/03-分布式的基石/README.md"
    - "凤凰架构：构建可靠的大型分布式系统/04-不可变基础设施/README.md"
    - "凤凰架构：构建可靠的大型分布式系统/05-技术方法论/README.md"
    - "凤凰架构：构建可靠的大型分布式系统/99-速查表.md"

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed
